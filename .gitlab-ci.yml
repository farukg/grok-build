workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - rustfmt.toml
        - .rustfmt.toml
        - .cargo/**/*
        - crates/**/*
        - prod/**/*
        - third_party/**/*
        - bin/**/*
        - SOURCE_REV
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
    - if: '$CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'

stages: [cleanup, validate, build]

variables:
  CARGO_LOCALBUILD_DEPS_VARIANT_MIN_AGE_SECS: "1"
  CARGO_LOCALBUILD_DEPS_USE_GUARD_SECS: "1"
  CARGO_LOCALBUILD_KEEP_FITTEST_DEPS_VARIANTS: "1"
  CARGO_LOCALBUILD_INCREMENTAL_SESSION_MAX_AGE_SECS: "1"
  CARGO_LOCALBUILD_ARTIFACT_ORPHAN_MIN_AGE_SECS: "1"
  CARGO_LOCALBUILD_KEEP_RECENT_BUILD_VARIANTS: "1"
  # Zero is rejected; one second is the smallest supported configuration idle bound.
  CARGO_LOCALBUILD_CONFIGURATION_IDLE_SECS: "1"

# Release-target cleanup must succeed before any cache consumer runs.
linux-cache-cleanup:
  stage: cleanup
  needs: []
  when: always
  tags: [nspawn]
  resource_group: grok-linux-release
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "1"
  cache: []
  script:
    - bash .gitlab/ci/cleanup.sh

linux-lockfile:
  stage: validate
  needs:
    - job: linux-cache-cleanup
      artifacts: false
  when: on_success
  tags: [nspawn]
  interruptible: true
  resource_group: grok-linux-release
  timeout: 4 hours
  variables:
    GIT_DEPTH: "20"
  cache: []
  script:
    - bash .gitlab/ci/build.sh lockfile
  artifacts:
    when: always
    name: cargo-lock-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID
    paths:
      - dist/lockfile/
    expire_in: 30 days

linux-format:
  stage: validate
  needs:
    - job: linux-cache-cleanup
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^grok-lock-inputs-/'
      when: never
    - when: on_success
  tags: [nspawn]
  interruptible: true
  resource_group: grok-linux-release
  timeout: 1 hour
  variables:
    GIT_DEPTH: "0"
  cache: []
  script:
    - bash .gitlab/ci/build.sh format
  artifacts:
    when: always
    name: format-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID
    paths:
      - dist/format/
    expire_in: 30 days

linux-tokio-checked-deadline:
  stage: validate
  needs:
    - job: linux-cache-cleanup
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^grok-lock-inputs-/'
      when: never
    - exists:
        - third_party/tokio/src/time/checked_deadline.rs
      when: on_success
  tags: [nspawn]
  interruptible: true
  resource_group: grok-linux-release
  timeout: 2 hours
  variables:
    GIT_DEPTH: "20"
  cache: []
  script:
    - bash .gitlab/ci/build.sh tokio-checked-deadline
  artifacts:
    when: always
    name: tokio-checked-deadline-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID
    paths:
      - dist/tokio-checked-deadline/
    expire_in: 30 days

linux-release:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^grok-lock-inputs-/'
      when: never
    - when: on_success
  needs:
    - job: linux-cache-cleanup
      artifacts: false
    - job: linux-format
      artifacts: false
    - job: linux-lockfile
      artifacts: false
    - job: linux-tokio-checked-deadline
      optional: true
      artifacts: false
  tags: [nspawn]
  interruptible: true
  resource_group: grok-linux-release
  timeout: 4 hours
  variables:
    GIT_DEPTH: "20"
  cache: []
  script:
    - bash .gitlab/ci/build.sh
  artifacts:
    name: grok-x86_64-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/grok-x86_64-linux.tar.gz
      - dist/grok-x86_64-linux.tar.gz.sha256
    expire_in: 30 days

linux-regression:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^grok-lock-inputs-/'
      when: never
    - when: manual
      allow_failure: true
  needs:
    - job: linux-cache-cleanup
      artifacts: false
    - job: linux-format
      artifacts: false
    - job: linux-lockfile
      artifacts: false
    - job: linux-tokio-checked-deadline
      optional: true
      artifacts: false
  tags: [nspawn]
  interruptible: true
  # Both jobs write the shared tools image, Cargo downloads and rustup cache.
  resource_group: grok-linux-release
  timeout: 4 hours
  variables:
    GIT_DEPTH: "20"
  cache: []
  script:
    - bash .gitlab/ci/build.sh regression
  artifacts:
    when: always
    name: regression-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID-$CI_JOB_ID
    paths:
      - dist/regression/
    expire_in: 30 days
