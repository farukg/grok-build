[package]
license = "Apache-2.0"
name = "xai-monotonic-clock"
version = "0.1.0"
edition.workspace = true
description = "Pure monotonic wire points and opt-in native Linux clock correlation"

[features]
default = []
native = ["dep:tokio", "dep:nix"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
tokio = { workspace = true, features = ["time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
