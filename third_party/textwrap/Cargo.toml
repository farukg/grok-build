[package]
edition = "2021"
rust-version = "1.70"
name = "textwrap"
version = "0.16.2"
publish = false
authors = ["Martin Geisler <martin@geisler.net>"]
build = false
exclude = [
    ".github/",
    ".gitignore",
    "benchmarks/",
    "examples/",
    "fuzz/",
    "images/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for word wrapping, indenting, and dedenting strings. Has optional support for Unicode and emojis as well as machine hyphenation."
documentation = "https://docs.rs/textwrap/"
readme = "README.md"
keywords = [
    "text",
    "formatting",
    "wrap",
    "typesetting",
    "hyphenation",
]
categories = [
    "text-processing",
    "command-line-interface",
]
license = "MIT"
repository = "https://github.com/mgeisler/textwrap"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
    "unicode-linebreak",
    "unicode-width",
    "smawk",
]

[lib]
name = "textwrap"
path = "src/lib.rs"

[[test]]
name = "indent"
path = "tests/indent.rs"

[[test]]
name = "version-numbers"
path = "tests/version-numbers.rs"

[dependencies.hyphenation]
version = "0.8.4"
features = ["embed_en-us"]
optional = true

[dependencies.smawk]
version = "0.3.2"
optional = true

[dependencies.terminal_size]
version = "0.4.0"
optional = true

[dependencies.unicode-linebreak]
version = "0.1.5"
optional = true

[dependencies.unicode-width]
version = "0.2.0"
optional = true

[dev-dependencies.unic-emoji-char]
version = "0.9.0"

[dev-dependencies.version-sync]
version = "0.9.5"

[target."cfg(unix)".dev-dependencies.termion]
version = "4.0.2"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
